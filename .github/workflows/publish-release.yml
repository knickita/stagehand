name: Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read addon version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import ast, pathlib; tree = ast.parse(pathlib.Path("Stagehand/__init__.py").read_text(encoding="utf-8")); node = next(n for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "bl_info" for t in n.targets)); info = ast.literal_eval(node.value); print(".".join(str(part) for part in info["version"]))')"
          if [[ -z "${version}" ]]; then
            echo "Unable to read Stagehand/__init__.py bl_info version"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Sync manifest version
        shell: bash
        run: |
          python -c 'import pathlib, re; path = pathlib.Path("Stagehand/blender_manifest.toml"); text = path.read_text(encoding="utf-8"); version = "${{ steps.version.outputs.version }}"; text, count = re.subn(r"(?m)^version\s*=\s*\"[^\"]*\"", f"version = \"{version}\"", text, count=1); assert count == 1, "Unable to update blender_manifest.toml version"; path.write_text(text, encoding="utf-8")'

      - name: Check whether tag exists
        id: tag
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Tag ${{ steps.version.outputs.tag }} already exists. Nothing to publish."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build addon zip
        if: steps.tag.outputs.exists == 'false'
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          package="../Stagehand-v${version}.zip"
          cd Stagehand
          zip -r "${package}" . \
            -x "**/__pycache__/*" \
            -x "**/*.pyc"

      - name: Create tag
        if: steps.tag.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Stagehand ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: Stagehand-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
